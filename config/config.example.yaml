mqtt:
  topic: print
  port: 8883
  hostname: erp
  auth:
    username: user
    password: password
erp:
  hostname: https://erp.com
  auth:
    username: user
    password: password
mss:
  hostname: https://mss.eledio.com
  auth:
    username: user
    password: password
printer:
  type: tsc  # or brother_ql
  # For TSC printers
  address: 192.168.1.1
  port: 9100
  health_poll_interval: 60  # seconds between background status polls (optional, default 60)
  # For Brother QL printers
  # identifier: usb://0x04f9:0x2015  # or tcp://192.168.1.1:9100
  # model: QL-500
logging:
  # optional; file or dir path (dir gets printer-tsc.log). omit = console only
  path: /var/log/printer-tsc/service.log
  level: DEBUG
  max_bytes: 1048576   # rotate at 1MB
  backup_count: 5       # keep 5 rotated files